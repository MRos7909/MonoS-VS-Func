[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-mfunc"
description = "Useful VapourSynth functions"
version = "1.0.0"
license = {text = "GPL-3.0"}
authors = [
  { name = "monos" },
]
readme = "README.md"

requires-python = ">=3.13"

dependencies = [
  "VapourSynth >= 78",
  "vsjetpack[full,nvidia] >= 2.2.0",
  "vs-maskdetail >= 4.0 @ git+https://github.com/MonoS/VS-MaskDetail.git",
  "awsmfunc >= 1.3.5"
]

[project.urls]
Homepage = "https://github.com/MonoS/MonoS-VS-Func"

[tool.setuptools.package-data]
xclean = ["py.typed"]

[project.optional-dependencies]
dev = ["toml"]